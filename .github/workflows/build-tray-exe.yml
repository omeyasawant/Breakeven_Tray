name: Build Breakeven_Tray Distributables

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_suffix: windows
            upload_path: dist/Breakeven_Tray.exe

          - os: ubuntu-latest
            artifact_suffix: linux
            upload_path: dist/Breakeven_Tray-x86_64.AppImage

          - os: macos-latest
            artifact_suffix: macos
            upload_path: dist/Breakeven_Tray.app.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Miniconda
        if: runner.os != 'macOS'
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: breakeven-tray
          python-version: "3.11"
          channels: conda-forge
          channel-priority: strict
          auto-update-conda: true

      - name: Setup Python (macOS universal2)
        if: runner.os == 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify macOS Python is universal2
        if: runner.os == 'macOS'
        shell: bash -l {0}
        run: |
          PYTHON_BIN="$(python -c 'import sys; print(sys.executable)')"
          echo "Using Python at $PYTHON_BIN"
          LIPO_INFO="$(lipo -info "$PYTHON_BIN" 2>/dev/null || file "$PYTHON_BIN")"
          echo "$LIPO_INFO"
          if [[ "$LIPO_INFO" != *"arm64"* || "$LIPO_INFO" != *"x86_64"* ]]; then
            echo "::error::The macOS Python interpreter is not universal2. Cannot produce a universal app bundle."
            exit 1
          fi

      - name: Install core dependencies (conda)
        if: runner.os != 'macOS'
        shell: bash -l {0}
        run: |
          conda install -y             python="3.11"             setuptools             pip

      - name: Install pip dependencies
        shell: bash -l {0}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export ARCHFLAGS="-arch arm64 -arch x86_64"
            export MACOSX_DEPLOYMENT_TARGET=11.0
          fi
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller==6.3.0

      - name: Configure macOS code signing
        if: runner.os == 'macOS'
        shell: bash -l {0}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_BUILD_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          echo "MACOS_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
          echo "MACOS_NOTARIZATION_ENABLED=false" >> "$GITHUB_ENV"

          missing=()
          for var in BUILD_CERTIFICATE_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD APPLE_SIGNING_IDENTITY; do
            if [ -z "${!var:-}" ]; then
              missing+=("$var")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::macOS Developer ID signing secrets missing (${missing[*]}). Building ad-hoc signed universal app."
            exit 0
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          if ! printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH" 2>/dev/null; then
            printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          echo "MACOS_SIGNING_ENABLED=true" >> "$GITHUB_ENV"
          echo "MACOS_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "MACOS_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            echo "MACOS_NOTARIZATION_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Apple notarization secrets missing (APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, or APPLE_TEAM_ID). App will be Developer ID signed but not notarized."
          fi

      - name: Install Linux Qt runtime helpers
        if: runner.os == 'Linux'
        shell: bash -l {0}
        run: |
          sudo apt-get update
          sudo apt-get install -y             libxcb-icccm4             libxcb-image0             libxcb-keysyms1             libxcb-render-util0             libxcb-shape0             libxcb-util1             libxcb-xinerama0             libxcb-xkb1             libxkbcommon-x11-0

      - name: Build (Windows .exe)
        if: runner.os == 'Windows'
        shell: bash -l {0}
        run: |
          python -m PyInstaller --onefile --windowed tray_app.py             --name Breakeven_Tray             --add-data "icon.png;."             --hidden-import psutil             --hidden-import requests             --hidden-import packaging             --hidden-import PyQt5

      - name: Build (macOS .app zip)
        if: runner.os == 'macOS'
        shell: bash -l {0}
        run: |
          export ARCHFLAGS="-arch arm64 -arch x86_64"
          export MACOSX_DEPLOYMENT_TARGET=11.0

          cat > build-macos-entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key>
            <true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
            <key>com.apple.security.cs.disable-library-validation</key>
            <true/>
          </dict>
          </plist>
          EOF

          PYINSTALLER_MAC_ARGS=(
            --target-arch universal2
            --osx-bundle-identifier com.breakeven.tray
          )

          if [ "${MACOS_SIGNING_ENABLED:-false}" = "true" ]; then
            PYINSTALLER_MAC_ARGS+=(
              --codesign-identity "$MACOS_SIGNING_IDENTITY"
              --osx-entitlements-file "$PWD/build-macos-entitlements.plist"
            )
          else
            echo "::warning::Building Breakeven_Tray with PyInstaller ad-hoc signing because Developer ID secrets were not provided."
          fi

          python -m PyInstaller --onedir --windowed tray_app.py             --name Breakeven_Tray             --add-data "icon.png:."             --hidden-import psutil             --hidden-import requests             --hidden-import packaging             --hidden-import PyQt5             "${PYINSTALLER_MAC_ARGS[@]}"

          python - << 'PY'
          import os
          import subprocess
          import sys

          bundle_root = os.path.join("dist", "Breakeven_Tray.app")
          invalid = []
          for root, _, files in os.walk(bundle_root):
            for name in files:
              file_path = os.path.join(root, name)
              if os.path.islink(file_path):
                continue
              result = subprocess.run(
                ["file", file_path],
                capture_output=True,
                text=True,
                check=False,
              )
              output = result.stdout.strip()
              if "Mach-O" not in output:
                continue
              if "arm64" not in output or "x86_64" not in output:
                invalid.append(output)

          if invalid:
            print("::error::The macOS app bundle contains non-universal Mach-O files:")
            for line in invalid[:50]:
              print(line)
            sys.exit(1)
          PY

          ditto -c -k --sequesterRsrc --keepParent "dist/Breakeven_Tray.app" "dist/Breakeven_Tray.app.zip"

      - name: Notarize macOS app bundle
        if: runner.os == 'macOS'
        shell: bash -l {0}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "${MACOS_NOTARIZATION_ENABLED:-false}" != "true" ]; then
            echo "::warning::Skipping notarization for Breakeven_Tray because Apple ID notarization secrets are unavailable."
            exit 0
          fi

          xcrun notarytool submit "dist/Breakeven_Tray.app.zip"             --apple-id "$APPLE_ID"             --password "$APPLE_APP_SPECIFIC_PASSWORD"             --team-id "$APPLE_TEAM_ID"             --wait

          xcrun stapler staple "dist/Breakeven_Tray.app"
          ditto -c -k --sequesterRsrc --keepParent "dist/Breakeven_Tray.app" "dist/Breakeven_Tray.app.zip"

      - name: Clean up macOS signing keychain
        if: runner.os == 'macOS' && always()
        shell: bash -l {0}
        run: |
          if [ -n "${MACOS_KEYCHAIN_PATH:-}" ] && [ -f "$MACOS_KEYCHAIN_PATH" ]; then
            security delete-keychain "$MACOS_KEYCHAIN_PATH" || true
          fi

      - name: Build (Linux AppImage)
        if: runner.os == 'Linux'
        shell: bash -l {0}
        run: |
          python -m PyInstaller --clean --noconfirm --onedir --windowed tray_app.py             --name Breakeven_Tray             --add-data "icon.png:."             --hidden-import psutil             --hidden-import requests             --hidden-import packaging             --hidden-import PyQt5             --hidden-import PyQt5.QtCore             --hidden-import PyQt5.QtGui             --hidden-import PyQt5.QtWidgets

          rm -rf AppDir
          mkdir -p AppDir/usr/lib
          cp -a dist/Breakeven_Tray AppDir/usr/lib/Breakeven_Tray
          APPROOT="AppDir/usr/lib/Breakeven_Tray"
          mkdir -p "$APPROOT/qt-host-libs"

          for helper_lib in             /usr/lib/x86_64-linux-gnu/libxcb-icccm.so.4             /usr/lib/x86_64-linux-gnu/libxcb-image.so.0             /usr/lib/x86_64-linux-gnu/libxcb-keysyms.so.1             /usr/lib/x86_64-linux-gnu/libxcb-render-util.so.0             /usr/lib/x86_64-linux-gnu/libxcb-shape.so.0             /usr/lib/x86_64-linux-gnu/libxcb-util.so.1             /usr/lib/x86_64-linux-gnu/libxcb-xinerama.so.0             /usr/lib/x86_64-linux-gnu/libxcb-xkb.so.1             /usr/lib/x86_64-linux-gnu/libxkbcommon-x11.so.0
          do
            if [ -f "$helper_lib" ]; then
              cp -aL "$helper_lib"* "$APPROOT/qt-host-libs/"
            fi
          done

          cat > AppDir/Breakeven_Tray.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Breakeven Tray
          Exec=Breakeven_Tray
          Icon=Breakeven_Tray
          Categories=Utility;
          Terminal=false
          EOF

          cp icon.png AppDir/Breakeven_Tray.png

          cat > AppDir/AppRun << 'EOF'
          #!/bin/sh
          set -eu

          sanitize_path_list() {
            VAR_NAME="$1"
            shift
            CURRENT_VALUE="$(printenv "$VAR_NAME" 2>/dev/null || true)"
            if [ -z "$CURRENT_VALUE" ]; then
              return 0
            fi

            SANITIZED_VALUE=""
            OLD_IFS="$IFS"
            IFS=':'
            for ENTRY in $CURRENT_VALUE; do
              [ -n "$ENTRY" ] || continue
              SKIP_ENTRY=0
              for BLOCKED_PREFIX in "$@"; do
                case "$ENTRY" in
                  "$BLOCKED_PREFIX"|"$BLOCKED_PREFIX"/*)
                    SKIP_ENTRY=1
                    break
                    ;;
                esac
              done
              if [ "$SKIP_ENTRY" -eq 0 ]; then
                if [ -n "$SANITIZED_VALUE" ]; then
                  SANITIZED_VALUE="$SANITIZED_VALUE:$ENTRY"
                else
                  SANITIZED_VALUE="$ENTRY"
                fi
              fi
            done
            IFS="$OLD_IFS"

            if [ -n "$SANITIZED_VALUE" ]; then
              export "$VAR_NAME=$SANITIZED_VALUE"
            else
              unset "$VAR_NAME"
            fi
          }

          HERE="$(dirname "$(readlink -f "$0")")"
          APPROOT="$HERE/usr/lib/Breakeven_Tray"
          APPROOT_INTERNAL="$APPROOT/_internal"
          QT_PLUGIN_PRIMARY="$APPROOT/_internal/PyQt5/Qt5/plugins"
          QT_PLUGIN_FALLBACK="$APPROOT/_internal/PyQt5/Qt/plugins"
          QT_LIB_PRIMARY="$APPROOT/_internal/PyQt5/Qt5/lib"
          QT_LIB_FALLBACK="$APPROOT/_internal/PyQt5/Qt/lib"
          QT_COMPAT_LIBS="$APPROOT/qt-host-libs"
          if [ -d "$QT_PLUGIN_PRIMARY" ] && [ -d "$QT_LIB_PRIMARY" ]; then
            QT_PLUGIN_ROOT="$QT_PLUGIN_PRIMARY"
            QT_LIB_ROOT="$QT_LIB_PRIMARY"
          else
            QT_PLUGIN_ROOT="$QT_PLUGIN_FALLBACK"
            QT_LIB_ROOT="$QT_LIB_FALLBACK"
          fi

          sanitize_path_list LD_LIBRARY_PATH "$APPROOT" "$APPROOT_INTERNAL"
          sanitize_path_list QT_PLUGIN_PATH "$APPROOT" "$APPROOT_INTERNAL"
          sanitize_path_list QT_QPA_PLATFORM_PLUGIN_PATH "$APPROOT" "$APPROOT_INTERNAL"
          unset QT_QPA_PLATFORMTHEME
          unset LD_PRELOAD
          unset PYTHONHOME

          export QT_PLUGIN_PATH="$QT_PLUGIN_ROOT"
          export QT_QPA_PLATFORM_PLUGIN_PATH="$QT_PLUGIN_ROOT/platforms"
          export LD_LIBRARY_PATH="$QT_LIB_ROOT:$QT_COMPAT_LIBS"
          export PYTHONFAULTHANDLER=1
          if [ "${BREAKEVEN_QT_DEBUG_PLUGINS:-0}" = "1" ]; then
            export QT_DEBUG_PLUGINS=1
          fi
          exec "$APPROOT/Breakeven_Tray" "$@"
          EOF
          chmod +x AppDir/AppRun

          curl -L -o appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          ./squashfs-root/AppRun AppDir dist/Breakeven_Tray-x86_64.AppImage
          chmod +x dist/Breakeven_Tray-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Breakeven_Tray-${{ matrix.artifact_suffix }}
          path: ${{ matrix.upload_path }}
